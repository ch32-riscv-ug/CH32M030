name: update

on:
  schedule:
    # Daily 19:07 UTC. Staggered from the other device repositories.
    - cron: '07 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download datasheets / EVT
        run: |
          chmod +x ./update.sh
          ./update.sh

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "update (automated)"
            git push
          fi

      - name: Keepalive (avoid 60-day schedule auto-disable)
        run: |
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit age: ${age_days} day(s)"
          if [ "$age_days" -ge 50 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: prevent scheduled workflow auto-disable"
            git push
          else
            echo "Recent activity exists; no keepalive commit needed."
          fi
